name: Update star history chart

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: star-chart
  cancel-in-progress: false

jobs:
  update:
    name: Refresh star history chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Update chart data and SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/star-chart.mjs

      - name: Commit chart updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history.svg
          if git diff --cached --quiet; then
            echo "Star history unchanged; nothing to commit."
          else
            git commit -m "chore: update star history chart"
            git push origin HEAD:master
          fi