name: Chrome Web Store release

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Validate the package without publishing it"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate credentials and package without publishing to the store"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: webstore-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and submit extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate package metadata
        run: bun run check:package

      - name: Run extension contract tests
        run: bun test tests/extension

      - name: Build extension zip
        run: bun run zip:extension

      - name: Run web store safety scan (fail closed on wrong target)
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bun run check:webstore

      - name: Submit to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: bun run webstore:submit -- $DRY_RUN_FLAG
