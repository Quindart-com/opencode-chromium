name: Chrome Web Store release

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Validate the package without publishing it"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate credentials and package without publishing to the store"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: webstore-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify extension package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate package metadata
        run: bun run check:package

      - name: Run extension contract tests
        run: bun test tests/extension

      - name: Build extension zip
        run: bun run zip:extension

      - name: Run web store safety scan
        run: bun run check:webstore

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opencode-chromium-extension
          if-no-files-found: error
          path: dist-extension/opencode-chromium-*-chrome.zip

  submit:
    name: Submit to Chrome Web Store
    if: >-
      github.event_name == 'workflow_call'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension zip
        run: bun run zip:extension

      - name: Run web store safety scan (fail closed on wrong target)
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bun run check:webstore

      - name: Submit to Chrome Web Store
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: bun run webstore:submit -- $DRY_RUN_FLAG
