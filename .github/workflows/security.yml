name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: secret scan over full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan all refs with pinned gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --log-opts="--all" --redact --exit-code 0 --verbose --config .gitleaks.toml .
      - name: fail on new leaks
        run: ./gitleaks git --log-opts="--all" --redact --exit-code 1 --config .gitleaks.toml --report-path gitleaks-report.json . || { echo "Secrets detected - see gitleaks-report.json artifact"; exit 1; }
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  personal-identifiers:
    name: identifier hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/contracts/release.test.js
