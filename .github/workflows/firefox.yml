name: Firefox Add-ons release
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: firefox-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run zip:extension:firefox && bun run check:firefox
      - run: bun test tests/firefox
      - name: Validate or submit listed AMO version
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: bun run firefox:submit -- $DRY_RUN_FLAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-firefox-extension
          path: dist-extension/*
          retention-days: 30
