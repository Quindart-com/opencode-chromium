name: Secure npm release

on:
  push:
    branches:
      - master
    paths:
      - "package.json"
    tags:
      - "opencode-chromium-mcp-v*"

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release || steps.validation.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: No release for validation-only events
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        id: validation
        run: echo "should_release=false" >> "$GITHUB_OUTPUT"

      - name: Check out full history
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect a forward version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check-version-bump.js --before "$BEFORE_SHA" --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    if: needs.release-metadata.outputs.should_release == 'true'
    needs: release-metadata
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/opencode-chromium
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Verify npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
          echo "Using npm $npm_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: bun run check:tag -- "$RELEASE_TAG"

      - name: Build release
        run: bun run build

      - name: Re-run release checks
        run: bun run check

      - name: Build and test release tarball
        run: |
          bun run pack
          bun run test:tarball
          bun run check:release

      - name: Skip when version already published
        shell: bash
        run: |
          published="$(npm view opencode-chromium@"${RELEASE_TAG#v}" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "Version $published is already published on npm; skipping publish step."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}

      - name: Publish with npm Trusted Publishing
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm publish --access public --ignore-scripts

  publish-shim:
    name: Publish opencode-chromium-mcp shim
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/opencode-chromium-mcp-v')
    needs: release-metadata
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/opencode-chromium-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
          echo "Using npm $npm_version"

      - name: Validate shim release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="opencode-chromium-mcp-v$(node -p "require('./packages/opencode-chromium-mcp/package.json').version")"
          if [ "$expected" != "$RELEASE_TAG" ]; then
            echo "Shim release tag $RELEASE_TAG does not match $expected." >&2
            exit 1
          fi
          echo "Shim release tag matches $expected"

      - name: Skip when version already published
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          published="$(npm view opencode-chromium-mcp@"${RELEASE_TAG#opencode-chromium-mcp-v}" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "Version $published is already published on npm; skipping publish step."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Publish shim with npm Trusted Publishing
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm publish --access public --ignore-scripts
        working-directory: packages/opencode-chromium-mcp

  github-release:
    name: Create GitHub release
    if: needs.release-metadata.outputs.should_release == 'true'
    needs: [release-metadata, publish, webstore-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "opencode-chromium $RELEASE_VERSION" --generate-notes

  webstore-release:
    name: Publish browser extension
    if: needs.release-metadata.outputs.should_release == 'true'
    needs: [release-metadata, publish]
    uses: ./.github/workflows/webstore.yml
    with:
      dry_run: false
    secrets: inherit
