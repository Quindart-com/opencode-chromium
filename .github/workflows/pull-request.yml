name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-reliability:
    name: Chromium / real extension reliability / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build && bun run build:extension
      - name: Install Chromium
        # Hosted runners already provide browser libraries, as in the verify job.
        run: node node_modules/playwright/cli.js install chromium
        timeout-minutes: 5
      - run: node scripts/verify-browser-reliability.js
        timeout-minutes: 5
      - run: node scripts/verify-tab-lifecycle.js
        timeout-minutes: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-reliability
          path: reports/browser-reliability.json

  firefox-integration:
    name: Firefox / extension and native host / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build && bun run build:extension:firefox
      - name: Download the verified Firefox test release
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/firefox-test-release"
          mkdir -p "$release/linux-x86_64/en-US"
          cd "$release"
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/157.0.1/SHA512SUMS -o SHA512SUMS
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/157.0.1/linux-x86_64/en-US/firefox-157.0.1.tar.xz -o linux-x86_64/en-US/firefox-157.0.1.tar.xz
          sha512sum --check --ignore-missing SHA512SUMS
          tar -xf linux-x86_64/en-US/firefox-157.0.1.tar.xz
          echo "OPENCODE_FIREFOX_TEST_EXECUTABLE=$release/firefox/firefox" >> "$GITHUB_ENV"
      - run: node scripts/verify-firefox.js
      - run: node scripts/verify-firefox-extension.js
      - run: node scripts/verify-firefox-uploads.js
      - run: node scripts/verify-firefox-uploads.js --frames
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: firefox-parity-results
          path: reports/*parity.json

  verify:
    name: Verify / Ubuntu / Node 24
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run check:metadata
      - run: bun run typecheck:backend
      - run: bun run typecheck:extension
      - run: bun run lint
      - run: bun run check:unused
      - run: bun run check:architecture
      - run: bun run build
      - run: bun run build:extension
      - run: bun run build:extension:firefox
      - run: bun run check:firefox
      - run: bun test
      - run: bun run check:package
      - run: bun run check:schemas
      - run: bun run check:release
      - name: Cache Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: chromium-cache
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-shell-${{ hashFiles('bun.lock') }}
      - name: Install Chromium headless shell on cache miss
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium
      - run: node scripts/verify-popup.js
      - run: node scripts/verify-onboarding.js && node scripts/verify-browsing-capabilities.js
      - run: bun run firefox:submit -- --dry-run
      - run: node scripts/verify-uploads.js
      - run: node scripts/verify-cursor.js

  package-smoke:
    name: Package / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - run: bun run test:tarball
