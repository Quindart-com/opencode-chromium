name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-integration:
    name: Firefox / extension and native host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build && bun run build:extension:firefox
      - name: Download the verified Firefox test release
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/firefox-test-release"
          mkdir -p "$release/linux-x86_64/en-US"
          cd "$release"
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/157.0.1/SHA512SUMS -o SHA512SUMS
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/157.0.1/linux-x86_64/en-US/firefox-157.0.1.tar.xz -o linux-x86_64/en-US/firefox-157.0.1.tar.xz
          sha512sum --check --ignore-missing SHA512SUMS
          tar -xf linux-x86_64/en-US/firefox-157.0.1.tar.xz
          echo "OPENCODE_FIREFOX_TEST_EXECUTABLE=$release/firefox/firefox" >> "$GITHUB_ENV"
      - run: node scripts/verify-firefox.js
      - run: node scripts/verify-firefox-extension.js
      - run: node scripts/verify-firefox-uploads.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firefox-parity-results
          path: reports/*parity.json

  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:backend
      - run: bun run typecheck:extension
      - run: bun run lint
      - run: bun run check:unused
      - run: bun run check:architecture
      - run: bun run build
      - run: bun run build:extension
      - run: bun run build:extension:firefox
      - run: bun run check:firefox
      - run: bun test
      - run: node --test tests/native-host/memory-reliability.test.js tests/native-host/memory-search.test.js tests/native-host/embedding-service.test.js tests/native-host/framing.test.js tests/core/reliability.test.js
      - run: bun run check:package
      - run: bun run check:schemas
      - run: bunx playwright install --with-deps chromium
      - run: node scripts/verify-popup.js
      - run: bun run firefox:submit -- --dry-run
      - run: node scripts/verify-uploads.js
      - run: node scripts/verify-cursor.js

  package-smoke:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - run: bun run test:tarball
