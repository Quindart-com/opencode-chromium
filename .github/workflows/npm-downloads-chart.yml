name: Update NPM downloads chart

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: npm-downloads-chart
  cancel-in-progress: false

jobs:
  update:
    name: Refresh NPM downloads chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Update chart data and SVG
        run: node scripts/npm-downloads-chart.mjs

      - name: Commit chart updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/npm-downloads.json assets/npm-downloads.svg
          if git diff --cached --quiet; then
            echo "NPM downloads history unchanged; nothing to commit."
          else
            git commit -m "chore: update NPM downloads chart"
            git push origin HEAD:master
          fi
